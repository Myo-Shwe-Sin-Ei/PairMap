[project]
name = "pairmap"
version = "1.0"
description = "Ontology alignment system for INM713 Part 2 coursework"
authors = [
    {name = "Myo Shwe Sin Ei"},
    {name = "Andrew Nguyen"},
]
requires-python = ">=3.10"
dependencies = [
    "owlready2>=0.46",
    "rdflib>=7.0",
    "rapidfuzz>=3.5",
    "sentence-transformers>=2.6",
    "owlrl>=7.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pairmap"]
